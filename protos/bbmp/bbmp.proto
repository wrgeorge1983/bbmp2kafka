syntax = "proto3";

package wrgeorge1983.net.bbmp;
option go_package = "github.com/wrgeorge1983/bbmp2kafka/bbmp";


import "net/api/net.proto";
import "route/api/route.proto";

message BBMPMessage {
  enum MessageType {
    Unknown = 0;
    PeerUpNotification = 1;
    PeerDownNotification = 2;
    InitiationMessage = 3;
    TerminationMessage = 4;
    RouteMonitoringMessage = 5;
    RouteMirroringMessage = 6;
  }
  MessageType message_type = 1;
  //    BBMPUnicastMonitoringMessage bbmp_unicast_monitoring_message = 2;
  reserved 2;
  reserved "bbmp_unicast_monitoring_message";

  RouteMonitoringMessage route_monitoring_message = 3;
}

message RouteMonitoringMessage {
  bio.net.IP router_ip = 1;
  bio.net.IP local_bpg_ip = 2;
  bio.net.IP neighbor_bgp_ip = 3;
  uint32 local_as = 4;
  uint32 remote_as = 5;
  bool announcement = 6;
  uint32 timestamp = 7;

  // Address Family information
  uint32 afi = 8;
  uint32 safi = 9;

  // NLRI and path attributes
  bio.net.Prefix pfx = 10;
  bio.route.BGPPath bgp_path = 11;

  // Optional attributes based on AFI/SAFI
  repeated uint32 labels = 12; // labels are 3 byte values, stored in the lower 3 bytes of the uint32
  bio.net.IP nexthop = 13;
  RouteDistinguisher route_distinguisher = 14;
}

message RouteDistinguisher {
  fixed64 value = 1;
}
